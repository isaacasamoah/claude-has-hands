<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form (iframe)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 1.25rem;
      line-height: 1.5;
    }

    h3 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      color: #7ecfff;
    }

    .badge {
      display: inline-block;
      background: #e63946;
      color: #fff;
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    label {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.8rem;
      color: #aaa;
    }

    input {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 0.4rem 0.6rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a4a;
      color: #eee;
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
    }
    input:focus {
      border-color: #7ecfff;
      outline: none;
    }

    .row {
      display: flex;
      gap: 0.75rem;
    }
    .row > div { flex: 1; }

    button {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 4px;
      background: #4361ee;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    button:hover { background: #3a56d4; }

    #payment-status {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #7ecfff;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h3>Payment Details <span class="badge">IFRAME</span></h3>

  <form id="payment-form" onsubmit="return handlePayment(event)">
    <div>
      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" name="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19" autocomplete="off">
    </div>

    <div class="row">
      <div>
        <label for="card-expiry">Expiry</label>
        <input type="text" id="card-expiry" name="expiry" placeholder="MM/YY" maxlength="5" autocomplete="off">
      </div>
      <div>
        <label for="card-cvc">CVC</label>
        <input type="text" id="card-cvc" name="cvc" placeholder="123" maxlength="4" autocomplete="off">
      </div>
    </div>

    <div>
      <label for="card-name">Name on Card</label>
      <input type="text" id="card-name" name="cardName" placeholder="J. Smith" autocomplete="off">
    </div>

    <button type="submit" id="pay-button">Pay Now</button>
  </form>

  <div id="payment-status">Awaiting payment details...</div>

<script>
  function handlePayment(event) {
    event.preventDefault();
    const card = document.getElementById('card-number').value;
    const expiry = document.getElementById('card-expiry').value;
    const cvc = document.getElementById('card-cvc').value;
    const name = document.getElementById('card-name').value;

    const status = document.getElementById('payment-status');

    if (!card || !expiry || !cvc) {
      status.textContent = 'Error: Please fill all required fields.';
      status.style.color = '#e63946';
      return false;
    }

    status.textContent = 'Payment submitted: card=****' + card.slice(-4) + ', name=' + name;
    status.style.color = '#4ade80';

    // Notify parent if available
    try {
      window.parent.postMessage({ type: 'payment-submitted', last4: card.slice(-4) }, '*');
    } catch (_) {}

    return false;
  }
</script>

</body>
</html>
