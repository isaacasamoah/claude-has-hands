<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Has Hands — Test Page 2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1a2e;
      background: #eef2ff;
      padding: 2rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1rem; }
    a { color: #4361ee; }
    .section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

  <h1>Test Page 2</h1>
  <p>You navigated here from the main fixture. Use browser_back to return.</p>

  <div class="section">
    <h3>Navigation Verification</h3>
    <p>If you can read this text, browser_navigate or link clicking worked correctly.</p>
    <a href="fixture.html" id="link-back">Back to main fixture</a>
  </div>

  <div class="section">
    <h3>Simple Form</h3>
    <form onsubmit="event.preventDefault(); document.getElementById('p2-status').textContent = 'Form submitted: ' + document.getElementById('p2-input').value;">
      <label for="p2-input" style="display:block; margin-bottom:0.25rem; font-size:0.85rem; font-weight:600;">Enter something</label>
      <input type="text" id="p2-input" style="display:block; width:100%; max-width:320px; padding:0.4rem 0.6rem; border:1px solid #ccc; border-radius:4px; margin-bottom:0.5rem;">
      <button type="submit" style="padding:0.4rem 0.9rem; border:1px solid #4361ee; border-radius:4px; background:#4361ee; color:#fff; cursor:pointer;">Submit</button>
    </form>
    <p id="p2-status" style="margin-top:0.5rem; font-family:monospace; font-size:0.8rem; color:#888;">Waiting...</p>
  </div>

</body>
</html>
